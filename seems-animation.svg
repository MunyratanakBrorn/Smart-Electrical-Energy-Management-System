<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="energyBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e676"/>
      <stop offset="0.6" stop-color="#ffd600"/>
      <stop offset="1" stop-color="#ff5252"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="760" height="280" rx="14" fill="url(#bg)"/>
  <text x="30" y="44" fill="#e6edf3" font-size="22" font-weight="700">⚡ SEEMS — Live Energy &amp; Load Control</text>
  <line x1="30" y1="58" x2="730" y2="58" stroke="#30363d" stroke-width="1.5"/>

  <!-- ===================== RELAY / LOAD ON-OFF ===================== -->
  <text x="30" y="92" fill="#8b949e" font-size="14" font-weight="600">RELAY · LOAD CONTROL</text>

  <!-- Source -->
  <rect x="30" y="108" width="70" height="46" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="65" y="130" fill="#c9d1d9" font-size="12" text-anchor="middle">AC</text>
  <text x="65" y="146" fill="#c9d1d9" font-size="12" text-anchor="middle">Source</text>

  <!-- Wire left -->
  <line x1="100" y1="131" x2="160" y2="131" stroke="#484f58" stroke-width="3"/>

  <!-- Switch pivot -->
  <circle cx="160" cy="131" r="5" fill="#58a6ff"/>
  <!-- Switch blade: toggles between open (up) and closed (flat) -->
  <line x1="160" y1="131" x2="214" y2="131" stroke="#00e676" stroke-width="4" stroke-linecap="round">
    <animate attributeName="x2" values="214;205;214" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="131;104;131" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#00e676;#ff5252;#00e676" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
  </line>
  <circle cx="214" cy="131" r="5" fill="#58a6ff"/>

  <!-- Wire right to load -->
  <line x1="214" y1="131" x2="274" y2="131" stroke="#484f58" stroke-width="3"/>

  <!-- Lamp / load -->
  <circle cx="300" cy="131" r="22" fill="#ffd600" stroke="#30363d" stroke-width="1.5" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.12;1" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="300" y="136" fill="#0d1117" font-size="16" font-weight="700" text-anchor="middle">💡</text>

  <!-- ON / OFF status pill -->
  <rect x="350" y="116" width="74" height="30" rx="15" fill="#0d2818">
    <animate attributeName="fill" values="#0d2818;#2d0f12;#0d2818" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
  </rect>
  <circle cx="367" cy="131" r="6" fill="#00e676">
    <animate attributeName="fill" values="#00e676;#ff5252;#00e676" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="382" y="136" font-size="14" font-weight="700" fill="#00e676">
    ON
    <animate attributeName="fill" values="#00e676;#ff5252;#00e676" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.49;0.5" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="380" y="136" font-size="14" font-weight="700" fill="#ff5252">
    OFF
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.49;0.5;0.99;1" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- ===================== ENERGY METER ===================== -->
  <text x="30" y="196" fill="#8b949e" font-size="14" font-weight="600">ENERGY METER · BL0910</text>

  <!-- Meter panel -->
  <rect x="30" y="208" width="700" height="56" rx="10" fill="#0d1117" stroke="#30363d"/>

  <!-- Voltage -->
  <text x="52" y="230" fill="#8b949e" font-size="11">VOLTAGE</text>
  <text x="52" y="252" fill="#58a6ff" font-size="20" font-weight="700">
    <tspan>220</tspan>
    <animate attributeName="fill" values="#58a6ff;#79c0ff;#58a6ff" dur="2s" repeatCount="indefinite"/>
  </text>
  <text x="98" y="252" fill="#8b949e" font-size="12">V</text>

  <!-- Current (animated value) -->
  <text x="150" y="230" fill="#8b949e" font-size="11">CURRENT</text>
  <text x="150" y="252" fill="#ffd600" font-size="20" font-weight="700">
    <animate attributeName="opacity" values="1;0.6;1" dur="1.2s" repeatCount="indefinite"/>
    4.7</text>
  <text x="196" y="252" fill="#8b949e" font-size="12">A</text>

  <!-- Power bar -->
  <text x="250" y="230" fill="#8b949e" font-size="11">POWER</text>
  <rect x="250" y="238" width="300" height="14" rx="7" fill="#21262d"/>
  <rect x="250" y="238" width="60" height="14" rx="7" fill="url(#energyBar)">
    <animate attributeName="width" values="60;290;120;240;60" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="560" y="250" fill="#00e676" font-size="16" font-weight="700">
    <animate attributeName="opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite"/>
    1.03 kW</text>

  <!-- Energy accumulation -->
  <text x="650" y="230" fill="#8b949e" font-size="11">ENERGY</text>
  <text x="650" y="252" fill="#e6edf3" font-size="16" font-weight="700">kWh ↑</text>

  <!-- moving energy pulse along power line -->
  <circle r="3" fill="#00e676" filter="url(#glow)">
    <animateMotion path="M250,245 H540" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
